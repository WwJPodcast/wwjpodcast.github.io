<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Video test (no cover)</title>
<style>
  html,body{margin:0;background:#fbf7ec;font-family:-apple-system,system-ui,sans-serif;color:#2f2924}
  .bar{display:flex;gap:6px;padding:6px 10px;flex-wrap:wrap;align-items:center}
  button{font:600 15px inherit;font-family:inherit;padding:8px 14px;border-radius:18px;border:1.5px solid #b8935a;background:#fff;color:#2f2924}
  button.on{background:#9b1c1c;color:#fff;border-color:#9b1c1c}
  #note{font-size:12px;padding:0 10px 4px;color:#6b6258}
  #stage{display:flex;justify-content:center}
  .box{position:relative}
  iframe{border:0;display:block}
</style></head><body>
<div class="bar" id="bar"></div>
<div id="note">Tap a letter, rotate to landscape, press play. Note which letters look right.</div>
<div id="stage"></div>
<script>
const ID='2pG6HBXiy4A';
const base=(host)=>'https://'+host+'/embed/'+ID+'?playsinline=1&rel=0&cc_load_policy=0';
const H=()=>Math.min(innerHeight-70, 360);
const V={
 A:['Current: 100% in 16:9 box, overflow hidden',()=>{const h=H(),w=h*16/9;return `<div class="box" style="width:${w}px;height:${h}px;overflow:hidden"><iframe src="${base('www.youtube.com')}&enablejsapi=1" style="width:100%;height:100%" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe></div>`}],
 B:['Explicit pixel size, no overflow clip',()=>{const h=H(),w=Math.round(h*16/9);return `<iframe src="${base('www.youtube.com')}" width="${w}" height="${h}" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`}],
 C:['Fixed 960x540 iframe, scaled down by CSS',()=>{const h=H(),k=h/540;return `<div class="box" style="width:${960*k}px;height:${h}px"><iframe src="${base('www.youtube.com')}" width="960" height="540" style="position:absolute;left:0;top:0;transform:scale(${k});transform-origin:0 0" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe></div>`}],
 D:['youtube-nocookie.com, explicit size',()=>{const h=H(),w=Math.round(h*16/9);return `<iframe src="${base('www.youtube-nocookie.com')}" width="${w}" height="${h}" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`}],
 E:['Width 100% of page, height auto 16:9 (full width)',()=>`<div style="width:100%;aspect-ratio:16/9;max-height:${innerHeight-70}px"><iframe src="${base('www.youtube.com')}" style="width:100%;height:100%" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe></div>`]
};
const bar=document.getElementById('bar'),stage=document.getElementById('stage'),note=document.getElementById('note');
function show(k){[...bar.children].forEach(b=>b.classList.toggle('on',b.textContent===k));note.textContent=k+': '+V[k][0];stage.innerHTML=V[k][1]();}
Object.keys(V).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k);bar.appendChild(b);});
</script></body></html>
