<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walking with Jesus — Listen</title>
<meta name="description" content="Hear Jesus here. Listen to Walking with Jesus, the Gospels in order, 15 minutes at a time.">
<meta name="theme-color" content="#FBF7EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7EC; --ink:#111; --red:#9A1114; --gold:#C4A059; --gold-soft:#E4D6B8;
    --muted:#6b625a; --track:#dcdad5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--cream);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}
  body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
       padding:max(18px,env(safe-area-inset-top)) 26px max(18px,env(safe-area-inset-bottom))}

  /* top half: logo */
  .logo{flex:0 0 auto;height:42vh;height:42dvh;max-height:420px;min-height:200px;display:flex;align-items:center;justify-content:center}
  .logo img{display:block;max-width:100%;max-height:100%;object-fit:contain}

  /* bottom half: player */
  .player{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding-top:6px}

  .pick{position:relative;display:inline-flex;align-items:center;justify-content:center;max-width:100%}
  .pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
  .pick .shown{pointer-events:none;text-align:center;display:inline-flex;align-items:center;gap:8px}
  .pick .chev{width:12px;height:12px;flex:0 0 auto;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg);opacity:.7}
  .pick:focus-within{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}

  .season .shown{font-weight:600;font-size:clamp(19px,5.4vw,27px);line-height:1.15;letter-spacing:.01em;padding:4px 2px}
  .epnum .shown{font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  .ticker{width:100%;overflow:hidden;white-space:nowrap;height:1.7em;position:relative;
          font-style:italic;font-weight:500;font-size:clamp(19px,5vw,24px);color:#4a423b;
          -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
                  mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
  .track{display:block;text-align:center;overflow:hidden;text-overflow:ellipsis;line-height:1.7em}
  .ticker.run .track{display:inline-block;overflow:visible;text-overflow:clip;will-change:transform;
                     animation:tick var(--dur,14s) linear infinite}
  @keyframes tick{from{transform:translateX(var(--from,100%))}to{transform:translateX(var(--to,-100%))}}
  @media (prefers-reduced-motion:reduce){.ticker.run .track{animation:none;display:block;overflow:hidden;text-overflow:ellipsis}}

  .bar{width:100%;margin-top:2px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;touch-action:none}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;
      background:linear-gradient(90deg,var(--red) var(--p,0%),var(--track) var(--p,0%))}
  input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--track)}
  input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--red)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--red);margin-top:-5px;border:2px solid var(--cream);box-shadow:0 1px 3px rgba(0,0,0,.25)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--cream)}
  .times{display:flex;justify-content:space-between;font-style:italic;font-size:15px;color:var(--muted);margin-top:-2px;font-variant-numeric:tabular-nums}

  .transport{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:6px}
  .play{width:84px;height:84px;border-radius:50%;border:0;background:var(--red);display:grid;place-items:center;cursor:pointer;
        box-shadow:0 6px 16px rgba(154,17,20,.28);transition:transform .08s}
  .play:active{transform:scale(.96)}
  .play svg{width:34px;height:34px;fill:#fff}
  .play .ic-pause{display:none}
  .playing .play .ic-play{display:none}
  .playing .play .ic-pause{display:block}
  .skip{width:48px;height:48px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink);opacity:.75;border-radius:50%}
  .skip:disabled{opacity:.25;cursor:default}
  .skip svg{width:26px;height:26px;fill:currentColor}

  .speeds{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .speeds button{min-width:54px;min-height:44px;padding:0 10px;border-radius:22px;border:1.5px solid var(--gold-soft);background:transparent;color:var(--ink);
        font-family:inherit;font-weight:600;font-size:18px;cursor:pointer}
  .speeds button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}

  .track .t{color:#2f2924}
  .track .r{color:var(--muted);font-size:.84em}
  .track .sep{color:var(--gold);padding:0 .5em}
  .track .gap{display:inline-block;width:30vw}
  .msg{font-style:italic;color:var(--muted);font-size:18px;text-align:center;min-height:1.3em}
  .msg button{font-family:inherit;font-size:inherit;color:var(--red);background:none;border:0;border-bottom:1px solid var(--red);cursor:pointer}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="logo"><img src="logo.png" alt="Walking with Jesus" width="1060" height="840"></div>

  <section class="player">
    <label class="pick season"><span class="shown"><span id="seasonLabel">Choose a season</span><i class="chev"></i></span>
      <select id="season" aria-label="Choose a season"></select></label>

    <label class="pick epnum"><span class="shown"><span id="epLabel">Episode</span><i class="chev"></i></span>
      <select id="episode" aria-label="Choose an episode"></select></label>

    <div class="ticker static" id="ticker" aria-live="off"><span class="track" id="track">Loading…</span></div>

    <div class="bar">
      <input type="range" id="seek" min="0" max="100" step="1" value="0" aria-label="Seek">
      <div class="times"><span id="tNow">0:00</span><span id="tLeft">−0:00</span></div>
    </div>

    <div class="transport">
      <button class="skip" id="prev" aria-label="Previous episode"><svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="play" id="play" aria-label="Play">
        <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="skip" id="next" aria-label="Next episode"><svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM4 5l10.5 7L4 19z"/></svg></button>
    </div>

    <div class="speeds" id="speeds" role="group" aria-label="Playback speed"></div>
    <div class="msg" id="msg"></div>
  </section>

</main>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  'use strict';
  /* ---------- config ---------- */
  const FEED_URL   = 'https://media.rss.com/walking-with-jesus/feed.xml';
  const FEED_PROXY = '';   // optional: a Cloudflare Worker URL that relays the feed with CORS headers
  const ENC_BASE   = 'https://content.rss.com/episodes/';
  const SEASONS = [
    { id: 1, label: 'Mark + John Harmony (4 weeks)',     total: 20 },
    { id: 2, label: 'Matthew + John Harmony (5 weeks)',  total: 25 },
    { id: 3, label: 'Luke + John Harmony (5 weeks)',     total: 25 },
    { id: 4, label: 'Four Gospel Harmony (10 weeks)',    total: 50 },
  ];
  const SPEEDS = [0.75, 1, 1.25, 1.5, 2];
  const STORE_KEY = 'wwj.player.v1', FEED_CACHE = 'wwj.feed.v2';

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const audio = $('audio'), app = $('app');
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
    return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let store = Object.assign({ speed: 1, season: null, pos: {}, last: {}, done: {} }, lsGet(STORE_KEY) || {});
  const save = () => lsSet(STORE_KEY, store);

  let eps = {};            // season id -> [{n,title,url,dur}] ascending
  let cur = { s: null, n: null };
  let pendingSeek = 0, lastSave = 0;

  /* ---------- feed ---------- */
  // The verses are written into each episode description. The wording differs by season, so try each known form.
  function extractRefs(html) {
    const d = new DOMParser().parseFromString(html || '', 'text/html');
    const paras = [...d.querySelectorAll('p')].map(p => p.textContent.replace(/\s+/g, ' ').trim()).filter(Boolean);
    const clean = s => s.replace(/\s+/g, ' ').replace(/[\s.]+$/, '').trim();
    const txt = paras.join('\n'); let m;
    if ((m = txt.match(/Today[’']s Scripture:\s*([^\n]+)/i))) return clean(m[1]);
    if ((m = txt.match(/Passages:\s*([^\n]+)/i))) return clean(m[1]);
    const f = paras[0] || '';
    if (/^[1-3]?\s?[A-Z][a-z]+\s\d+/.test(f) && f.length < 260) return clean(f);
    if ((m = txt.match(/Today[’']s episode covers:\s*([^\n]+)/i))) return clean(m[1].replace(/\s*\(.*$/, ''));
    return '';
  }
  function parseFeed(text) {
    const x = new DOMParser().parseFromString(text, 'text/xml');
    if (x.querySelector('parsererror')) throw new Error('bad xml');
    const g = (i, n) => { const e = [...i.children].find(c => c.nodeName === n); return e ? e.textContent.trim() : ''; };
    const out = [];
    x.querySelectorAll('item').forEach(i => {
      const s = +g(i,'itunes:season'), n = +g(i,'itunes:episode'), type = g(i,'itunes:episodeType') || 'full';
      const enc = i.querySelector('enclosure');
      if (!s || !n || type === 'trailer' || !enc) return;
      out.push([s, n, g(i,'title'), enc.getAttribute('url'), +g(i,'itunes:duration') || 0, extractRefs(g(i,'description'))]);
    });
    if (!out.length) throw new Error('no episodes');
    return out;
  }
  function build(rows) {
    const m = {};
    rows.forEach(([s,n,title,url,dur,refs]) => { (m[s] = m[s] || []).push({ n, title, url, dur, refs: refs || '' }); });
    Object.values(m).forEach(a => a.sort((p,q) => p.n - q.n));
    return m;
  }
  async function grab(url) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
    try { const r = await fetch(url, { signal: ctl.signal, cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); return await r.text(); }
    finally { clearTimeout(t); }
  }
  // Order: live feed -> optional relay -> episodes.json (a copy of the feed kept next to this page).
  async function loadLive() {
    const urls = [FEED_URL].concat(FEED_PROXY ? [FEED_PROXY] : []);
    for (const u of urls) { try { const rows = parseFeed(await grab(u)); lsSet(FEED_CACHE, rows); return rows; } catch (e) {} }
    const snap = JSON.parse(await grab('episodes.json'));
    const rows = snap.filter(r => r[5] !== 'trailer').map(r => [r[0], r[1], r[2], ENC_BASE + r[3], r[4], r[6] || '']);
    if (!rows.length) throw new Error('empty');
    return rows;
  }

  /* ---------- UI ---------- */
  const seasonSel = $('season'), epSel = $('episode'), seek = $('seek');
  SEASONS.forEach(s => seasonSel.add(new Option(s.label, s.id)));
  const seasonInfo = id => SEASONS.find(s => s.id === id);

  SPEEDS.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = (v === 1 ? '1' : String(v)) + '×'; b.dataset.v = v;
    b.addEventListener('click', () => setSpeed(v));
    $('speeds').appendChild(b);
  });
  function setSpeed(v) {
    store.speed = v; audio.playbackRate = v; save();
    [...$('speeds').children].forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
  }

  function fillEpisodes() {
    const list = eps[cur.s] || [];
    epSel.innerHTML = '';
    list.forEach(e => epSel.add(new Option((store.done[cur.s + '-' + e.n] ? '✓  ' : '') + e.n + ' — ' + e.title, e.n)));
    epSel.value = cur.n;
  }
  function paintLabels() {
    const list = eps[cur.s] || [], i = list.findIndex(e => e.n === cur.n), total = seasonInfo(cur.s).total;
    $('seasonLabel').textContent = seasonInfo(cur.s).label;
    seasonSel.value = cur.s;
    $('epLabel').textContent = 'Episode ' + cur.n + ' of ' + Math.max(total, list.length);
    $('prev').disabled = false;
    $('next').disabled = i < 0 || i >= list.length - 1;
  }

  // Paused: the title alone, centered. Playing: the title, then its verses, scrolling right to left.
  function setTicker(e, running) {
    const t = $('ticker'), tr = $('track');
    tr.textContent = '';
    t.classList.remove('run'); t.classList.add('static');
    const add = (cls, txt) => { const s = document.createElement('span'); s.className = cls; s.textContent = txt; tr.appendChild(s); };
    add('t', e.title);
    if (running) {
      if (e.refs) { add('sep', '·'); add('r', e.refs); }
      add('gap', '');
      t.classList.remove('static'); t.classList.add('run');
      const c = t.clientWidth, w = tr.offsetWidth, speed = 62;       // px per second
      tr.style.setProperty('--from', c + 'px');
      tr.style.setProperty('--to', (-w) + 'px');
      tr.style.setProperty('--dur', Math.max(8, (c + w) / speed) + 's');
    }
  }
  const curEp = () => (eps[cur.s] || []).find(e => e.n === cur.n);
  const refreshTicker = () => { const e = curEp(); if (e) setTicker(e, !audio.paused && !audio.ended); };

  function paintTime() {
    const d = audio.duration && isFinite(audio.duration) ? audio.duration : (curEp() ? curEp().dur : 0);
    const t = audio.currentTime || 0;
    seek.max = d || 100; seek.value = t;
    seek.style.setProperty('--p', d ? (t / d * 100) + '%' : '0%');
    $('tNow').textContent = fmt(t);
    $('tLeft').textContent = '−' + fmt(Math.max(0, d - t));
  }

  /* ---------- progress memory ---------- */
  function saveProgress() {
    if (cur.s == null || !audio.src) return;
    const k = cur.s + '-' + cur.n, d = audio.duration;
    if (isFinite(d) && audio.currentTime > 3) {
      if (audio.currentTime >= d - 8) { store.done[k] = true; delete store.pos[k]; }
      else store.pos[k] = Math.floor(audio.currentTime);
    }
    store.last[cur.s] = cur.n; store.season = cur.s; save();
  }

  /* ---------- load / navigate ---------- */
  function loadEpisode(s, n, autoplay) {
    if (cur.s != null) saveProgress();
    cur = { s, n };
    const e = curEp(); if (!e) return;
    const k = s + '-' + n, p = store.pos[k] || 0;
    pendingSeek = p > 3 && (!e.dur || p < e.dur - 10) ? p : 0;
    audio.src = e.url; audio.load();
    audio.playbackRate = store.speed;
    store.last[s] = n; store.season = s; save();
    fillEpisodes(); paintLabels(); paintTime();
    setTicker(e, false);
    seek.max = e.dur || 100; seek.value = pendingSeek;
    $('tNow').textContent = fmt(pendingSeek); $('tLeft').textContent = '−' + fmt(Math.max(0, (e.dur || 0) - pendingSeek));
    seek.style.setProperty('--p', e.dur ? (pendingSeek / e.dur * 100) + '%' : '0%');
    updateMediaSession();
    if (autoplay) audio.play().catch(() => {});
  }
  function pickSeason(s) {
    const list = eps[s] || []; if (!list.length) return;
    const n = list.some(e => e.n === store.last[s]) ? store.last[s] : list[0].n;
    audio.pause(); loadEpisode(s, n, false);
  }
  function step(dir, autoplay) {
    const list = eps[cur.s] || [], i = list.findIndex(e => e.n === cur.n), j = i + dir;
    if (j < 0 || j >= list.length) return false;
    loadEpisode(cur.s, list[j].n, autoplay); return true;
  }

  /* ---------- events ---------- */
  $('play').addEventListener('click', () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); });
  $('prev').addEventListener('click', () => { if (audio.currentTime > 5) audio.currentTime = 0; else step(-1, !audio.paused); });
  $('next').addEventListener('click', () => step(1, !audio.paused));
  seasonSel.addEventListener('change', () => pickSeason(+seasonSel.value));
  epSel.addEventListener('change', () => loadEpisode(cur.s, +epSel.value, !audio.paused));
  seek.addEventListener('input', () => { audio.currentTime = +seek.value; paintTime(); });

  audio.addEventListener('loadedmetadata', () => {
    if (pendingSeek) { audio.currentTime = pendingSeek; pendingSeek = 0; }
    audio.playbackRate = store.speed; paintTime();
  });
  audio.addEventListener('play',  () => { app.classList.add('playing'); $('play').setAttribute('aria-label','Pause'); audio.playbackRate = store.speed; refreshTicker(); setPlaybackState(); });
  audio.addEventListener('pause', () => { app.classList.remove('playing'); $('play').setAttribute('aria-label','Play'); refreshTicker(); saveProgress(); setPlaybackState(); });
  audio.addEventListener('timeupdate', () => {
    paintTime();
    const now = Date.now(); if (now - lastSave > 5000) { lastSave = now; saveProgress(); }
  });
  audio.addEventListener('ended', () => {
    const k = cur.s + '-' + cur.n; store.done[k] = true; delete store.pos[k]; save();
    if (!step(1, true)) { app.classList.remove('playing'); fillEpisodes(); refreshTicker(); }
    else fillEpisodes();
  });
  audio.addEventListener('error', () => msg('That episode would not load. Check your connection and try again.'));
  window.addEventListener('resize', () => { if (!audio.paused) refreshTicker(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });
  window.addEventListener('pagehide', saveProgress);

  function msg(t, retry) {
    const m = $('msg'); m.textContent = t || '';
    if (retry) { const b = document.createElement('button'); b.textContent = 'Try again'; b.onclick = start; m.append(' ', b); }
  }

  /* ---------- lock screen / headphone controls ---------- */
  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const e = curEp(); if (!e) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: e.title, artist: 'Walking with Jesus', album: seasonInfo(cur.s).label,
      artwork: [{ src: new URL('logo.png', location.href).href, sizes: '1060x840', type: 'image/png' }]
    });
  }
  function setPlaybackState() { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing'; }
  if ('mediaSession' in navigator) {
    const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    h('play', () => audio.play()); h('pause', () => audio.pause());
    h('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - ((d && d.seekOffset) || 15)); });
    h('seekforward',  d => { audio.currentTime = audio.currentTime + ((d && d.seekOffset) || 30); });
    h('previoustrack', () => step(-1, true)); h('nexttrack', () => step(1, true));
    h('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  }

  /* ---------- start ---------- */
  function show(rows) {
    eps = build(rows);
    if (cur.s == null) {
      const s = eps[store.season] ? store.season : (SEASONS.find(x => eps[x.id]) || {}).id;
      if (s == null) return;
      pickSeason(s);
    } else { fillEpisodes(); paintLabels(); }
  }
  async function start() {
    msg('');
    const cached = lsGet(FEED_CACHE);
    if (cached) { try { show(cached); } catch {} }
    try { show(await loadLive()); }
    catch (e) { if (!cached) msg('Could not load the episode list. ', true); }
  }
  setSpeed(store.speed);
  start();
})();
</script>
</body>
</html>
