<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- NOTE: no viewport-fit=cover here. It breaks YouTube embeds on iPhone landscape. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walking with Jesus — Watch</title>
<meta name="description" content="The whole story of Jesus, in order. Tap a picture and it plays. Nothing to search for.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="Watch Jesus">
<link rel="apple-touch-icon" href="../../hearjesus/apple-touch-icon.png">
<style>
:root{--navy:#1b2a49;--gold:#b8862b;--red:#88231d;--cream:#fbf7ec;--parchment:#f6efe0;--ink:#1d2433;--muted:#4a5266;--line:#e2d6bb;
--serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--parchment);color:var(--ink);font-size:22px;line-height:1.4}
header{background:var(--navy);text-align:center;padding:20px 16px 22px}
header h1{font-family:var(--serif);color:#fff;font-size:1.7rem;line-height:1.2}
header p{font-family:var(--serif);color:#e3b55b;font-size:1.2rem;margin-top:6px}
main{max-width:560px;margin:0 auto;padding:8px 16px 40px}
.ep{padding:28px 0 8px;border-bottom:2px solid var(--line)}
.num{font-weight:700;color:var(--navy);font-size:1.5rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;margin-bottom:24px}
.vid button{all:unset;display:block;width:100%;height:100%;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.vid img{display:block;width:100%;height:100%;object-fit:cover}
.vid .play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(27,42,73,.88);border:4px solid #fff}
.vid .play::after{content:"";position:absolute;left:32px;top:21px;border-style:solid;border-width:19px 0 19px 30px;border-color:transparent transparent transparent #fff}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.msg{padding:30px 0;text-align:center;color:var(--muted)}
@media (orientation:landscape) and (max-height:520px){
  main{max-width:min(100%,calc((100dvh - 24px) * 1.7778 + 32px))}
}
</style>
</head>
<body>
<header>
  <h1>Walking with Jesus</h1>
  <p>Tap a picture to watch</p>
</header>
<main id="list"><p class="msg">Loading…</p></main>

<script>
(function(){
  var list=document.getElementById('list'), KEY='wwj-grandma-last';
  function get(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json();});}
  Promise.all([get('../../hearjesus/videos.json')]).then(function(r){
    var vids=r[0]['4']||{};
    var nums=Object.keys(vids).map(Number).sort(function(a,b){return a-b;});
    list.innerHTML='';
    nums.forEach(function(n){
      var id=vids[n], s=document.createElement('section');
      s.className='ep'; s.id='ep'+n;
      s.innerHTML='<div class="num">Episode '+n+'</div><div class="vid"><button type="button" aria-label="Play episode '+n+'"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/'+id+'/hqdefault.jpg"><span class="play"></span></button></div>';
      s.querySelector('button').addEventListener('click',function(){
        var box=s.querySelector('.vid');
        box.innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0" title="Episode '+n+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
        try{localStorage.setItem(KEY,String(n));}catch(e){}
      });
      list.appendChild(s);
    });
    try{
      var last=localStorage.getItem(KEY), el=last&&document.getElementById('ep'+last);
      if(el){setTimeout(function(){el.scrollIntoView();},50);}
    }catch(e){}
  }).catch(function(){
    list.innerHTML='<p class="msg">Sorry, the videos did not load. Please check your internet and refresh this page.</p>';
  });
})();
</script>
</body>
</html>
